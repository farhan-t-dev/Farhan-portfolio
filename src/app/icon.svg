<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Handover mark: two document rules on ink — one read (paper),
       one live (signal). Sharp corners, no radius, palette-locked. -->
  <rect width="32" height="32" fill="#151515"/>
  <rect x="7" y="9" width="18" height="5" fill="#f3f3f0"/>
  <rect x="7" y="18" width="18" height="5" fill="#e30613"/>
</svg>
